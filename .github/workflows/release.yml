name: Stable release

# Manual: pins a stable release to the exact commit a nightly was built from. Rebuilds that commit
# with a clean version (no nightly suffix), tags it vX.Y.Z and publishes a normal release whose
# notes name the nightly it came from. Optionally pushes the version bump to main.
on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: Nightly release tag to promote (e.g. nightly-20260909-abc1234)
        required: true
      version:
        description: Stable version, X.Y.Z (becomes tag vX.Y.Z and the in-app version)
        required: true
      bump_main:
        description: Also commit the version bump to main
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the nightly's commit
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ inputs.version }}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must be X.Y.Z"; exit 1 ;;
          esac
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then echo "tag v${{ inputs.version }} already exists"; exit 1; fi
          gh release view "${{ inputs.nightly_tag }}" --json tagName,targetCommitish,isPrerelease > nightly.json
          cat nightly.json
          git fetch --tags origin
          SHA=$(git rev-parse "${{ inputs.nightly_tag }}^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "nightly commit: $SHA"

      - name: Check out that commit and set the stable version
        run: |
          git checkout --detach "${{ steps.nightly.outputs.sha }}"
          IFS=. read -r MA MI PA <<< "${{ inputs.version }}"
          sed -i -e "s/^version.major = .*/version.major = $MA/" \
                 -e "s/^version.minor = .*/version.minor = $MI/" \
                 -e "s/^version.patch = .*/version.patch = $PA/" \
                 -e "s/^version.prerelease = .*/version.prerelease = nil/" src/version.lua
          grep -n '^version\.' src/version.lua

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q p7zip-full zip rsync libcairo2
          python3 -m pip install --quiet cairosvg lupa

      - name: Build
        run: |
          ./build.sh
          ls -la dist
          test -f "dist/AestheticSpruce_v${{ inputs.version }}_sd-overlay.zip"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" "${{ steps.nightly.outputs.sha }}" \
            -m "Aesthetic Spruce v${{ inputs.version }} (pinned from ${{ inputs.nightly_tag }})"
          git push origin "v${{ inputs.version }}"
          cat > notes.md <<MD
          Aesthetic Spruce v${{ inputs.version }}, pinned to commit ${{ steps.nightly.outputs.sha }} from nightly \`${{ inputs.nightly_tag }}\`.

          Install: unzip \`AestheticSpruce_v${{ inputs.version }}_sd-overlay.zip\` onto the root of the spruceOS card so \`App/AestheticSpruce\` sits next to your other apps, then launch it from Apps. Built for spruceOS 4.3.x on aarch64 devices; see the README for the device list.

          Unofficial port of Aesthetic by Jonathan Avila; please support the original author: https://ko-fi.com/F1F51COHHT
          MD
          gh release create "v${{ inputs.version }}" \
            --target "${{ steps.nightly.outputs.sha }}" \
            --title "Aesthetic Spruce v${{ inputs.version }}" \
            --notes-file notes.md \
            dist/*.zip dist/*.7z dist/SHA256SUMS.txt

      - name: Bump version on main
        if: ${{ inputs.bump_main }}
        run: |
          git stash -q -- src/version.lua || true
          git checkout main
          git stash pop -q || true
          git add src/version.lua
          git commit -m "Bump version to ${{ inputs.version }}"
          git push origin main
